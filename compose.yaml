services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
    entrypoint: ["pnpm"]
    command: ["worker:sync"]
    profiles: ["tools"]
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules

volumes:
  web_node_modules:
  web_next:
  worker_node_modules:
